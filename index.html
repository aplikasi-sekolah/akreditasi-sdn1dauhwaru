<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIAKRED – Sistem Akreditasi Sekolah</title>
<style>
:root{--pri:#1f2f8f;--bg:#f7f9fc;--side:#c9dce6;--ink:#1f2a3a;--mut:#667;--line:#d5deea;--ok:#1f9d55;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
.split{display:grid;grid-template-columns:1.2fr 1fr;min-height:100vh}
.info{padding:56px 8%}.info h1{font-size:3rem;color:var(--pri);margin:0 0 16px}
.side{background:var(--side);display:flex;align-items:center;padding:32px 10%}
form{width:100%}label{display:block;margin:14px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:60px}button{font:inherit;border:0;border-radius:8px;background:var(--pri);color:#fff;padding:11px 18px;cursor:pointer;margin-top:12px}
button.alt{background:#fff;color:var(--pri);border:1px solid var(--pri);margin:0}
form button{width:100%}.mut{color:var(--mut);font-size:.9rem}
#msg.ok{color:var(--ok)}#msg.err{color:var(--bad)}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--pri);color:#fff;padding:12px 20px}
header span{flex:1;opacity:.9}header .alt{padding:7px 14px}
header nav button{background:transparent;border:0;margin:0;padding:8px 12px}header nav button.on{background:#fff;color:var(--pri)}
main{max-width:900px;margin:0 auto;padding:20px}
table{width:100%;border-collapse:collapse;background:#fff;margin:10px 0}th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.it{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.it p{margin:0 0 6px;font-weight:600}
.it select{width:auto;margin-bottom:6px}.sc{background:#fff;border-left:6px solid var(--pri);padding:14px;font-size:1.2rem;margin:10px 0}
.box{max-width:520px;margin:60px auto;padding:20px;background:#fff;border-radius:12px}
.row{display:flex;gap:8px}.lg{width:120px;display:block;margin-bottom:10px}.sn{font-weight:800;font-size:1.25rem;letter-spacing:.5px;color:var(--pri);margin-bottom:6px}.hl{height:38px}.st{font-weight:700;letter-spacing:.5px;color:var(--ink);max-width:520px}.tw{overflow-x:auto}.ac button{margin:2px}
@media(max-width:760px){.split{grid-template-columns:1fr}.info{padding:28px}}
@media(prefers-color-scheme:dark){:root{--pri:#5a73e6;--bg:#10151f;--side:#1d2a3a;--ink:#e8edf5;--line:#2e3b50;--mut:#9aa7bd}
input,select,textarea,table,.it,.sc,.box{background:#18202e;color:var(--ink)}header nav button.on,button.alt{background:#18202e}}
</style></head><body>

const $=s=>document.querySelector(s),app=$("#app");
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=(t,ok)=>{const m=$("#msg");if(m){m.textContent=t;m.className=ok?"ok":"err"}};
const main=h=>$("#main").innerHTML=h;
const ST={menunggu:"⏳ Menunggu",disetujui:"✅ Disetujui",ditolak:"❌ Ditolak"};
const ROLE={guru:"Guru",admin:"Admin",asesor:"Asesor"};
let db,me,ins=[];

async function init(){
  if(SUPABASE_URL.startsWith("ISI")){app.innerHTML='<div class="box"><h2>Konfigurasi belum diisi</h2><p>Isi SUPABASE_URL dan SUPABASE_KEY di bagian atas script pada index.html.</p></div>';return}
  const ic=document.createElement("link");ic.rel="icon";ic.href=LOGO;document.head.appendChild(ic);
  db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const{data:{session}}=await db.auth.getSession();
  session?boot():login();
}
function login(mode){
  const d=mode==="daftar";
  app.innerHTML=`<div class="split"><section class="info"><img src="${LOGO}" alt="Logo ${esc(NAMA_SEKOLAH)}" class="lg"><div class="sn">SD NEGERI 1 DAUHWARU</div><h1>SIAKRED</h1>
  <p class="st">SISTEM PENILAIAN AKREDITASI SD NEGERI 1 DAUHWARU</p></section>
  <section class="side"><form id="f"><h2>${d?"DAFTAR AKUN GURU":"LOG IN"}</h2>
  ${d?'<label>Nama lengkap</label><input id="nm" required>':""}
  <label>Email</label><input id="em" type="email" placeholder="Enter email" required>
  <label>Password</label><input id="pw" type="password" minlength="6" placeholder="Enter password" required>
  <button>${d?"Daftar":"Sign In"}</button><p id="msg"></p>
  <a href="#" id="sw">${d?"Sudah punya akun? Masuk":"Belum punya akun? Daftar"}</a></form></section></div>`;
  $("#sw").onclick=e=>{e.preventDefault();login(d?"":"daftar")};
  $("#f").onsubmit=async e=>{e.preventDefault();msg("Memproses…",1);
    const em=$("#em").value.trim(),pw=$("#pw").value;
    const r=d?await db.auth.signUp({email:em,password:pw,options:{data:{nama:$("#nm").value.trim()}}}):await db.auth.signInWithPassword({email:em,password:pw});
    if(r.error)return msg(r.error.message);
    if(d&&!r.data.session)return msg("Pendaftaran berhasil. Cek email untuk konfirmasi, lalu masuk.",1);
    boot()};
}
async function boot(){
  const{data:{user}}=await db.auth.getUser();
  const{data:p}=await db.from("profiles").select("*").eq("id",user.id).single();
  me={role:"guru",nama:user.email,...p,id:user.id};
  ins=(await db.from("instrumen").select("*").order("id")).data||[];
  const T=me.role==="asesor"?[["nilai","Penilaian"],["dok","Dokumen"]]:[["dia","Daftar Isian"],["dok","Dokumen"],["hasil","Hasil"]];
  if(me.role==="admin")T.push(["user","Pengguna"]);
  app.innerHTML=`<header><img src="${LOGO}" class="hl" alt=""><b>SIAKRED</b><span>${esc(me.nama)} · ${ROLE[me.role]}</span>
  <nav id="nav">${T.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join("")}</nav><button class="alt" id="out">Keluar</button></header><main id="main"></main>`;
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>tab(b.dataset.k));
  $("#out").onclick=async()=>{await db.auth.signOut();login()};
  tab(T[0][0]);
}
function tab(k){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  if(k==="dok"){main('<h2>Dokumen Pendukung</h2><div id="dk"></div>');dok($("#dk"))}
  else({dia,hasil,nilai,user})[k]();
}
const opts=v=>[1,2,3,4].map(n=>`<option ${v==n?"selected":""}>${n}</option>`).join("");
const grup=(i,last)=>i.standar!==last?`<h3>${esc(i.standar)}</h3>`:"";
const mapBy=a=>Object.fromEntries((a||[]).map(x=>[x.instrumen_id,x]));

/* ---------- DATA SEKOLAH BERSAMA (guru & admin) ---------- */
async function dia(){
  const m=mapBy((await db.from("jawaban").select("*")).data);
  let s="",last="";
  ins.forEach(i=>{const j=m[i.id]||{};s+=grup(i,last)+`<div class="it" data-i="${i.id}"><p>${esc(i.butir)}</p>
    <select class="sk"><option value="">Skor…</option>${opts(j.skor)}</select>
    <textarea class="ur" placeholder="Uraian / bukti pendukung">${esc(j.uraian)}</textarea></div>`;last=i.standar});
  main(`<h2>Daftar Isian Akreditasi (DIA)</h2><p class="mut">Data ini dipakai bersama oleh seluruh guru. Skor 1 = belum memenuhi, 4 = sangat baik.</p>${s}<button id="sv">Simpan</button><p id="msg"></p>`);
  $("#sv").onclick=async()=>{
    const rows=[...document.querySelectorAll(".it")].map(e=>({instrumen_id:+e.dataset.i,
      skor:e.querySelector(".sk").value?+e.querySelector(".sk").value:null,uraian:e.querySelector(".ur").value,
      updated_by:me.id,updated_at:new Date().toISOString()})).filter(r=>r.skor||r.uraian);
    const{error}=await db.from("jawaban").upsert(rows,{onConflict:"instrumen_id"});
    msg(error?error.message:"Tersimpan ✔",!error)};
}
async function dok(t){
  const{data}=await db.from("dokumen").select("*").order("created_at",{ascending:false});
  const ad=me.role==="admin",up=me.role!=="asesor";
  t.innerHTML=`${up?'<div class="row"><input type="file" id="fl"><button id="up" style="margin:0">Unggah</button></div><p id="msg" class="mut">Maksimal 10 MB. Berkas baru menunggu persetujuan admin.</p>':'<p class="mut">Hanya berkas yang sudah disetujui admin yang tampil.</p>'}
  <div class="tw"><table><tr><th>Berkas</th><th>Pengunggah</th><th>Tanggal</th><th>Status</th><th></th></tr>${(data||[]).map(d=>`<tr><td>${esc(d.nama)}</td><td>${esc(d.uploader_nama)}</td>
  <td>${new Date(d.created_at).toLocaleDateString("id-ID")}</td><td>${ST[d.status]}${d.catatan_admin?`<div class="mut">${esc(d.catatan_admin)}</div>`:""}</td>
  <td class="ac"><button class="alt" data-u="${esc(d.path)}">Unduh</button>
  ${ad&&d.status!=="disetujui"?`<button class="alt" data-a="${d.id}">Setujui</button>`:""}
  ${ad&&d.status!=="ditolak"?`<button class="alt" data-r="${d.id}">Tolak</button>`:""}
  ${ad||(d.uploader_id===me.id&&d.status!=="disetujui")?`<button class="alt" data-d="${d.id}" data-p="${esc(d.path)}">Hapus</button>`:""}</td></tr>`).join("")||'<tr><td colspan="5">Belum ada dokumen.</td></tr>'}</table></div>`;
  t.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{const{data}=await db.storage.from("dokumen").createSignedUrl(b.dataset.u,60);if(data)window.open(data.signedUrl)});
  const rv=async(id,status,c)=>{const{error}=await db.from("dokumen").update({status,catatan_admin:c,reviewed_by:me.id,reviewed_at:new Date().toISOString()}).eq("id",id);if(error)alert(error.message);dok(t)};
  t.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>rv(b.dataset.a,"disetujui",null));
  t.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const c=prompt("Alasan penolakan (boleh dikosongkan):");if(c!==null)rv(b.dataset.r,"ditolak",c)});
  t.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(!confirm("Hapus dokumen ini?"))return;
    await db.storage.from("dokumen").remove([b.dataset.p]);const{error}=await db.from("dokumen").delete().eq("id",b.dataset.d);if(error)alert(error.message);dok(t)});
  if(up)t.querySelector("#up").onclick=async()=>{
    const f=t.querySelector("#fl").files[0];if(!f)return msg("Pilih berkas dulu.");if(f.size>10e6)return msg("Ukuran melebihi 10 MB.");
    const p=`sekolah/${Date.now()}_${f.name.replace(/[^\w.\-]/g,"_")}`;msg("Mengunggah…",1);
    const u=await db.storage.from("dokumen").upload(p,f);if(u.error)return msg(u.error.message);
    const{error}=await db.from("dokumen").insert({nama:f.name,path:p,uploader_id:me.id,uploader_nama:me.nama});
    if(error)return msg(error.message);dok(t)};
}
async function hasil(){
  const data=(await db.from("penilaian").select("*")).data||[],m=mapBy(data);
  const v=data.filter(x=>x.nilai);let box='<p class="mut">Belum dinilai asesor.</p>';
  if(v.length){const n=v.reduce((a,x)=>a+x.nilai,0)/v.length/4*100;
    const pr=n>=91?"A (Unggul)":n>=81?"B (Baik)":n>=71?"C (Cukup)":"Belum memenuhi";
    box=`<div class="sc"><b>${n.toFixed(1)}</b> · Predikat ${pr}<div class="mut">Ambang predikat bisa disesuaikan di kode.</div></div>`}
  main(`<h2>Hasil Penilaian</h2>${box}<div class="tw"><table><tr><th>Butir</th><th>Nilai</th><th>Catatan asesor</th></tr>
  ${ins.map(i=>`<tr><td>${esc(i.butir)}</td><td>${m[i.id]?.nilai??"-"}</td><td>${esc(m[i.id]?.catatan)}</td></tr>`).join("")}</table></div>`);
}

/* ---------- ASESOR ---------- */
async function nilai(){
  const[a,b]=await Promise.all([db.from("jawaban").select("*"),db.from("penilaian").select("*")]);
  const J=mapBy(a.data),P=mapBy(b.data);let s="",last="";
  ins.forEach(i=>{const j=J[i.id]||{},p=P[i.id]||{};s+=grup(i,last)+`<div class="it" data-i="${i.id}"><p>${esc(i.butir)}</p>
    <div class="mut">Skor sekolah: <b>${j.skor??"-"}</b> · ${esc(j.uraian)||"<i>tanpa uraian</i>"}</div>
    <select class="sk"><option value="">Nilai asesor…</option>${opts(p.nilai)}</select>
    <textarea class="ur" placeholder="Catatan asesor">${esc(p.catatan)}</textarea></div>`;last=i.standar});
  main(`<h2>Penilaian Asesor</h2>${s}<button id="sv">Simpan Penilaian</button><p id="msg"></p>`);
  $("#sv").onclick=async()=>{
    const rows=[...document.querySelectorAll(".it")].map(e=>({instrumen_id:+e.dataset.i,
      nilai:e.querySelector(".sk").value?+e.querySelector(".sk").value:null,catatan:e.querySelector(".ur").value,asesor_id:me.id}))
      .filter(r=>r.nilai||r.catatan);
    const{error}=await db.from("penilaian").upsert(rows,{onConflict:"instrumen_id"});
    msg(error?error.message:"Penilaian tersimpan ✔",!error)};
}

/* ---------- ADMIN ---------- */
async function user(){
  const{data}=await db.from("profiles").select("*").order("nama");
  main(`<h2>Pengguna</h2><p class="mut">Guru: mengisi data dan mengunggah berkas. Asesor: menilai. Admin: menyetujui berkas dan mengatur pengguna.</p>
  <div class="tw"><table><tr><th>Nama</th><th>Peran</th><th></th></tr>${(data||[]).map(p=>`<tr><td>${esc(p.nama)}</td>
  <td><select data-id="${p.id}">${Object.entries(ROLE).map(([k,l])=>`<option value="${k}" ${p.role===k?"selected":""}>${l}</option>`).join("")}</select></td>
  <td><button data-s="${p.id}" style="margin:0">Simpan</button></td></tr>`).join("")}</table></div><p id="msg"></p>`);
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{
    const r=document.querySelector(`select[data-id="${b.dataset.s}"]`).value;
    const{error}=await db.from("profiles").update({role:r}).eq("id",b.dataset.s);
    msg(error?error.message:"Peran diperbarui ✔",!error)});
}
init();
</script></body></html>
